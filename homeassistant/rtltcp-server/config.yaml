# Home Assistant add-on. The version is bumped by the release workflow after each release
# (the Dockerfile downloads exactly this version from repository.jaycloud.at).
name: rtltcp.server
version: "1.8.0"
slug: rtltcp_server
# Prebuilt by the release workflow (job "homeassistant"): Home Assistant downloads instead of building
image: ghcr.io/jaylo1401/{arch}-addon-rtltcp_server
description: rtl_tcp-Server für RTL-SDR-Sticks – Weboberfläche, Auto-Reconnect, rtltcp_v2
url: https://github.com/JayLo1401/rtltcp.server
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
init: false
# Host network: every stick port (1234, 1235 …) is reachable directly, like a normal rtl_tcp.
host_network: true
usb: true
udev: true
# Web interface in the Home Assistant sidebar (HA does the login).
# Port 0: the Supervisor picks a free port (host network!), run.sh passes it on - no port conflicts.
ingress: true
ingress_port: 0
panel_icon: mdi:radio-tower
panel_title: rtltcp.server
# web_port: direct access to the web interface (own login), empty = only via Home Assistant.
# stream_port: port of the first stick, only used on the very first start (later: web interface → Geräte).
options:
  web_port: 8099
  stream_port: 1234
schema:
  web_port: port?
  stream_port: port
